# --- INTERFAZ Y DECORACIONES (PARCHEADO) ---
linux_display_server x11
hide_window_decorations yes
window_padding_width 10
confirm_os_window_close 0
sync_to_monitor yes

# --- COLORES Y TRANSPARENCIA ---
background            #0f111a
foreground            #e0e0e0
cursor                #00ff00
background_opacity    0.88
dynamic_background_opacity yes

# --- FUENTES ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
symbol_map U+E0A0-U+E0A3,U+E0C0-U+E0C7 PowerlineSymbols

# --- COMPORTAMIENTO ---
shell /usr/bin/zsh
mouse_map right click ungrabbed paste_from_selection

# --- NAVEGACIÓN ENTRE PANELES ---
map ctrl+left neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up neighboring_window up
map ctrl+down neighboring_window down

# --- BORDES ---
active_border_color #ff0000
inactive_border_color #444444
window_margin_width 1
draw_minimal_borders yes

# --- LANZAMIENTO (MISMO DIRECTORIO) ---
map ctrl+shift+enter launch --cwd=current
map ctrl+shift+t launch --type=tab --cwd=current

# --- BUFFERS ADICIONALES ---
# Buffer S
map ctrl+alt+s copy_to_buffer buffer_s
map ctrl+alt+d paste_from_buffer buffer_s

# Buffer A
map ctrl+alt+a copy_to_buffer buffer_a
map ctrl+alt+q paste_from_buffer buffer_a
