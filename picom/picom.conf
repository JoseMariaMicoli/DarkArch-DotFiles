#################################
#    DARK-ARCH PICOM CONFIG     #
#################################

# --- ESQUINAS REDONDEADAS ---
corner-radius = 12;

# Excluimos solo el escritorio y los marcos internos de i3
# Permitimos que Polybar se redondee para que use su radio de 12
rounded-corners-exclude = [
  "window_type = 'desktop'",
  "class_g = 'i3-frame'"
];

#################################
#           SOMBRAS             #
#################################
shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.7;
shadow-color = "#000000";

# No queremos sombras en el dock para que no ensucie la barra flotante
shadow-exclude = [
  "window_type = 'dock'",
  "class_g = 'Polybar'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#           DIFUMINADO (BLUR)   #
#################################
# Esto hará que lo que esté detrás de tu barra o terminales se vea profesional
blur:
{
  method = "dual_kawase";
  strength = 5;
}

# No difuminar el escritorio
blur-background-exclude = [
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#           OPACIDAD            #
#################################
inactive-opacity = 0.90;
frame-opacity = 1.0;
inactive-opacity-override = false;
active-opacity = 1.0;

# Forzamos opacidad total en Polybar
opacity-rule = [
  "100:class_g = 'Polybar'",
  "100:class_g = 'Rofi'"
];

#################################
#           FADING              #
#################################
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

#################################
#           GENERAL             #
#################################
# Backend GLX obligatorio para dual_kawase y esquinas
backend = "glx";
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
use-damage = true;

# --- REGLAS DE CAPAS (Z-INDEX) ---
# Esto ayuda a que i3 y Polybar se entiendan sobre quién está arriba
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.75; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 0.8; }
  dropdown_menu = { opacity = 0.8; }
};