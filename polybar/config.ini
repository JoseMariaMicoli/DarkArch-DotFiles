[colors]
bg = #0a0f14
bg-alt = #101820
red = #ff003c
cyan = #00eaff
green = #39ff14
amber = #ffb000
fg = #c5d1d9
muted = #4b5b63

; ================= TOP BAR =================

[bar/top]
monitor = ${env:MONITOR:}
width = 100%
height = 28
radius = 0
background = ${colors.bg}
foreground = ${colors.fg}
wm-restack = i3
override-redirect = false
tray-position = right
tray-detached = false
tray-maxsize = 18
tray-padding = 0
padding-right = 2
tray-background = ${colors.bg}
enable-ipc = true
module-margin = 1
padding-left = 0

font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "FiraCode Nerd Font:size=11;2"
font-2 = "Red October:size=12;2"

modules-left = rofi target
modules-center = vpn iplocal ippublic
modules-right = cpu memory wifi eth pulseaudio mic bluetooth xkeyboard date powermenu

; ---------- launcher ----------
[module/rofi]
type = custom/text
format = ""
format-foreground = ${colors.red}
click-left = bash -lc "rofi -show drun -theme ~/.config/rofi/soviet.rasi"

; ---------- powermenu ----------
[module/powermenu]
type = custom/text
format = ""
format-foreground = ${colors.red}
click-left = bash -lc "~/.config/rofi/powermenu.sh"

; ---------- target ----------
[module/target]
type = custom/script
interval = 1
exec = bash -lc 'IP=$(cat ~/.config/polybar/target 2>/dev/null); [ -z "$IP" ] && echo "󰓾" || echo "󰓾 $IP"'
format-foreground = ${colors.red}

[module/vpn]
type = custom/script
interval = 5
# Usamos %{F#00ff00} para el verde y %{F-} para cerrar el color
exec = bash -lc 'IP=$(ip -4 addr show tun0 2>/dev/null | grep inet | awk "{print \\$2}" | cut -d/ -f1); [ -z "$IP" ] && echo " %{F#ff0000}OFF" || echo "%{F#32CD32} $IP%{F-}"'

; ---------- ips ----------
[module/iplocal]
type = custom/script
interval = 3
# Lógica: Prioriza Wi-Fi (wlp3s0), si no hay pasa a Ethernet (enp2s0).
exec = bash -c 'IP_WLAN=$(ip addr show wlp3s0 2>/dev/null | grep -w inet | awk "{print \$2}" | cut -d/ -f1); IP_ETH=$(ip addr show enp2s0 2>/dev/null | grep -w inet | awk "{print \$2}" | cut -d/ -f1); if [ -n "$IP_WLAN" ]; then echo "%{F#00ffff} $IP_WLAN%{F-}"; elif [ -n "$IP_ETH" ]; then echo "%{F#00ffff} $IP_ETH%{F-}"; else echo "%{F#FF0000}󰲛 OFF%{F-}"; fi'

# Abre el gestor de redes al hacer click
click-left = st -e nmtui

[module/ippublic]
type = custom/script
interval = 300
# Parcheado: User-Agent real para evitar "Upstream connect error"
exec = curl -s -H "User-Agent: Mozilla/5.0" https://icanhazip.com || echo "Offline"
format-prefix = "🌐 "
format-prefix-foreground = ${colors.red}

; ---------- cpu ----------
[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.cyan}

; ---------- ram ----------
[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.amber}

; ---------- NETWORK ----------
[module/wifi]
type = internal/network
interface = wlp3s0
interval = 1.0

format-connected = <ramp-signal> <label-connected>
format-connected-foreground = ${colors.cyan}
label-connected = %downspeed:8% ↓ %upspeed:8% ↑
label-connected-foreground = ${colors.fg}

format-disconnected = 󰤮 DISCONNECTED
format-disconnected-foreground = ${colors.muted}

ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨

[module/eth]
type = internal/network
interface = enp2s0
interval = 5
format-connected = 󰈀 %local_ip%
format-connected-foreground = ${colors.green}
format-disconnected = 󰈂
format-disconnected-foreground = ${colors.muted}

; ---------- VOLUMEN REAL PULSEAUDIO ----------
[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
interval = 1
format-volume = <label-volume>
label-volume =  %percentage%%
label-volume-foreground = ${colors.amber}
label-muted = 
label-muted-foreground = ${colors.muted}
click-right = pactl set-sink-mute @DEFAULT_SINK@ toggle

; ---------- MIC ----------
[module/mic]
type = custom/script
interval = 1
# Si está muteado: Icono Rojo. Si está activo: Icono Verde Fósforo.
exec = bash -lc 'pactl get-source-mute @DEFAULT_SOURCE@ | grep -q yes && echo "%{F#FF0000}%{F-}" || echo "%{F#39FF14}%{F-}"'
click-left = bash -lc "pactl set-source-mute @DEFAULT_SOURCE@ toggle"

# Eliminamos format-foreground para que mande el color del script
format-foreground =

; ---------- bluetooth (CORREGIDO) ----------
[module/bluetooth]
type = custom/script
interval = 2
# Si está bloqueado (off): Gris oscuro. Si está activo (on): Cyan brillante.
exec = bash -c "rfkill list bluetooth | grep -q 'Soft blocked: yes' && echo '%{F#555555}󰂲%{F-}' || echo '%{F#00ffff}󰂯%{F-}'"
click-left = bash -c "if rfkill list bluetooth | grep -q 'Soft blocked: yes'; then rfkill unblock bluetooth && bluetoothctl power on; else bluetoothctl power off && rfkill block bluetooth; fi"

# Borramos la línea fija para que el script mande sobre el color
format-foreground =

; ---------- xkeyboard (ESTABLE 2 LETRAS) ----------

[module/xkeyboard]
type = internal/xkeyboard

; Bloqueamos indicadores secundarios
blacklist-0 = num lock
blacklist-1 = scroll lock

; Estética
format-prefix = "  "
format-prefix-foreground = ${colors.red}

; --- CONFIGURACIÓN DE NOMBRE COMPLETO ---
; Dejamos que muestre el nombre completo sin recortes
label-layout = %layout%
label-layout-foreground = ${colors.fg}

; Caps Lock (A roja)
label-indicator-on-capslock = " %{F#ff003c}A%{F-}"
label-indicator-on-capslock-foreground = ${colors.red}

; El clic para cambiar idioma (asegúrate de que el IPC de la barra esté en true)
click-left = setxkbmap -layout "us,latam,br,ru" -option "grp:alt_shift_toggle"

; ---------- date ----------
[module/date]
type = internal/date
interval = 1
date = %d/%m/%Y
time = %H:%M:%S
label =  %date%  %time%
label-foreground = ${colors.fg}

; ================= BOTTOM FLOATING PATCHED (RED) =================

[bar/bottom]
# --- POSICIONAMIENTO ---
width = 30%
height = 26
offset-x = 35%
offset-y = 8
bottom = true
fixed-center = true

# --- CAPAS (ESTO SOLUCIONA QUE QUEDE ATRÁS) ---
# override-redirect debe ser true para flotar, pero wm-restack debe ser i3
override-redirect = true
wm-restack = i3
# IMPORTANTE: Activa el control remoto de la barra
enable-ipc = true

# --- ESTÉTICA ROJA ---
background = ${colors.bg}
foreground = ${colors.red}
radius = 12
border-size = 2
border-color = ${colors.red}

# --- FUENTE UNIFICADA ---
font-0 = "JetBrainsMono Nerd Font:style=Bold:size=11;3"
font-1 = "Symbols Nerd Font:size=12;3"

modules-center = i3

[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true

label-focused = %name%
label-focused-background = ${colors.red}
label-focused-foreground = #000000
label-focused-padding = 2

label-unfocused = %name%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 2

label-urgent = %name%
label-urgent-background = ${colors.green}
label-urgent-padding = 2